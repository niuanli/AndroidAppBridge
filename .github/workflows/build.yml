name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AppBridge.csproj
      - name: Check formatting
        run: dotnet format whitespace AppBridge.csproj --no-restore --verify-no-changes
      - name: Build
        run: dotnet build AppBridge.csproj -c Release --no-restore
      - name: Offline checks
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'bin/Release/net8.0-windows/AndroidAppBridge.exe'
          foreach ($argument in @('--self-test', '--ui-check')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$argument failed: $($process.ExitCode)" }
          }
          Get-Content bin/Release/net8.0-windows/self-test-result.txt
          Get-Content bin/Release/net8.0-windows/ui-check-result.txt
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-check-results
          path: |
            bin/Release/net8.0-windows/*result.txt
            bin/Release/net8.0-windows/ui-*.png
            bin/Release/net8.0-windows/about-*.png
