name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AndroidAppBridge.sln
      - name: Check formatting
        run: dotnet format whitespace AndroidAppBridge.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build AndroidAppBridge.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/AndroidAppBridge.Tests/AndroidAppBridge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory artifacts/test-results
      - name: UI checks
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'src/AndroidAppBridge.WinForms/bin/Release/net8.0-windows/AndroidAppBridge.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "UI checks failed: $($process.ExitCode)" }
          Get-Content src/AndroidAppBridge.WinForms/bin/Release/net8.0-windows/ui-check-result.txt
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-check-results
          path: |
            artifacts/test-results/*.trx
            src/AndroidAppBridge.WinForms/bin/Release/net8.0-windows/*result.txt
            src/AndroidAppBridge.WinForms/bin/Release/net8.0-windows/ui-*.png
            src/AndroidAppBridge.WinForms/bin/Release/net8.0-windows/about-*.png
